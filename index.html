<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能提词器 - 语音跟随滚动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #64b5f6;
        }

        .header p {
            color: #aaa;
            font-size: 1rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
            
            .input-section, .control-section {
                flex: 1;
            }
        }

        .input-section {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .input-section h2, .control-section h2 {
            color: #81c784;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .input-section textarea {
            width: 100%;
            height: 300px;
            background: #2d2d2d;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            resize: vertical;
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
            border-color: #64b5f6;
            box-shadow: 0 0 0 2px rgba(100, 181, 246, 0.2);
        }

        .control-section {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-size: 1rem;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 4px;
            outline: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #64b5f6;
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-container span {
            min-width: 40px;
            text-align: center;
            font-weight: bold;
            color: #64b5f6;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 120px;
        }

        .btn-start {
            background: #4caf50;
            color: white;
        }

        .btn-start:hover {
            background: #43a047;
        }

        .btn-pause {
            background: #ff9800;
            color: white;
        }

        .btn-pause:hover {
            background: #f57c00;
        }

        .btn-reset {
            background: #f44336;
            color: white;
        }

        .btn-reset:hover {
            background: #e53935;
        }

        .btn-voice {
            background: #9c27b0;
            color: white;
        }

        .btn-voice:hover {
            background: #8e24aa;
        }

        .prompter-section {
            margin-top: 40px;
            background: #000;
            border-radius: 12px;
            padding: 40px 20px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        #prompter-display {
            font-weight: 600;
            line-height: 1.8;
            text-align: center;
            transition: all 0.3s ease;
            max-width: 90%;
            word-wrap: break-word;
        }

        .status-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.active {
            background: #4caf50;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .voice-status {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .mic-icon {
            width: 20px;
            height: 20px;
            background: #f44336;
            border-radius: 50%;
            position: relative;
        }

        .mic-icon.listening {
            background: #4caf50;
            animation: listening 0.8s infinite alternate;
        }

        @keyframes listening {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #777;
            font-size: 0.9rem;
        }

        .compatibility-warning {
            background: #ff9800;
            color: #000;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .compatibility-warning.show {
            display: block;
        }

        @media (max-width: 767px) {
            body {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .container {
                gap: 20px;
            }
            
            .input-section, .control-section {
                padding: 20px;
            }
            
            button {
                min-width: 100px;
                padding: 10px 16px;
            }
            
            .prompter-section {
                min-height: 300px;
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎤 智能提词器</h1>
        <p>语音跟随滚动 | 响应式设计 | 无需安装</p>
    </div>

    <div class="container">
        <div class="input-section">
            <h2>📝 输入台词</h2>
            <textarea id="text-input" placeholder="请在此处输入或粘贴您的台词内容...&#10;&#10;例如：&#10;尊敬的各位来宾，大家好！&#10;欢迎参加今天的发布会。&#10;今天我们将为大家介绍一款革命性的产品..."></textarea>
        </div>

        <div class="control-section">
            <h2>⚙️ 控制面板</h2>
            
            <div class="control-group">
                <label>行宽调节 (字符数): <span id="line-width-value">55</span></label>
                <div class="slider-container">
                    <input type="range" id="line-width" min="30" max="80" value="55">
                </div>
            </div>

            <div class="control-group">
                <label>字号大小 (像素): <span id="font-size-value">48</span></label>
                <div class="slider-container">
                    <input type="range" id="font-size" min="20" max="80" value="48">
                </div>
            </div>

            <div class="control-group">
                <label>滚动速度 (1-10级): <span id="speed-value">5</span></label>
                <div class="slider-container">
                    <input type="range" id="speed" min="1" max="10" value="5">
                </div>
            </div>

            <div class="button-group">
                <button class="btn-start" id="start-btn">▶️ 开始滚动</button>
                <button class="btn-pause" id="pause-btn">⏸️ 暂停</button>
                <button class="btn-reset" id="reset-btn">🔄 重置</button>
                <button class="btn-voice" id="voice-btn">🎤 语音跟随</button>
            </div>

            <div class="compatibility-warning" id="compatibility-warning">
                ⚠️ 语音识别功能需要 Chrome/Edge 浏览器支持。其他浏览器可能无法使用语音跟随功能。
            </div>
        </div>
    </div>

    <div class="prompter-section">
        <div class="voice-status">
            <div class="mic-icon" id="mic-icon"></div>
            <span id="voice-status-text">语音识别未启动</span>
        </div>
        
        <div class="status-indicator">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">准备就绪</span>
        </div>
        
        <div id="prompter-display">
            请输入台词内容，然后点击"开始滚动"
        </div>
    </div>

    <div class="footer">
        <p>智能提词器 v1.0 | 纯前端实现 | 支持手机端和电脑端 | 部署于 GitHub Pages</p>
        <p>使用 Web Speech API 实现语音跟随滚动 | 兼容 Chrome/Edge 浏览器</p>
    </div>

    <script>
        // 全局变量
        let isPlaying = false;
        let isVoiceEnabled = false;
        let currentPosition = 0;
        let animationId = null;
        let speechRecognition = null;
        let isSpeechSupported = false;
        
        // DOM 元素
        const textInput = document.getElementById('text-input');
        const prompterDisplay = document.getElementById('prompter-display');
        const lineWidthSlider = document.getElementById('line-width');
        const fontSizeSlider = document.getElementById('font-size');
        const speedSlider = document.getElementById('speed');
        const lineWidthValue = document.getElementById('line-width-value');
        const fontSizeValue = document.getElementById('font-size-value');
        const speedValue = document.getElementById('speed-value');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const micIcon = document.getElementById('mic-icon');
        const voiceStatusText = document.getElementById('voice-status-text');
        const compatibilityWarning = document.getElementById('compatibility-warning');

        // 检查浏览器兼容性
        function checkCompatibility() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            isSpeechSupported = !!SpeechRecognition;
            
            if (!isSpeechSupported) {
                compatibilityWarning.classList.add('show');
                voiceBtn.disabled = true;
                voiceBtn.style.opacity = '0.6';
                voiceBtn.style.cursor = 'not-allowed';
            }
            
            return isSpeechSupported;
        }

        // 初始化语音识别
        function initSpeechRecognition() {
            if (!isSpeechSupported) return null;
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';
            
            recognition.onstart = function() {
                console.log('语音识别已启动');
                micIcon.classList.add('listening');
                voiceStatusText.textContent = '正在监听语音...';
                updateStatus('语音监听中', 'active');
            };
            
            recognition.onresult = function(event) {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                // 检测到语音时开始滚动
                if (finalTranscript || interimTranscript) {
                    if (!isPlaying) {
                        startScrolling();
                    }
                }
            };
            
            recognition.onerror = function(event) {
                console.error('语音识别错误:', event.error);
                if (event.error === 'not-allowed') {
                    voiceStatusText.textContent = '麦克风权限被拒绝';
                    compatibilityWarning.textContent = '⚠️ 需要麦克风权限才能使用语音跟随功能';
                    compatibilityWarning.classList.add('show');
                }
                micIcon.classList.remove('listening');
                updateStatus('语音识别错误', '');
            };
            
            recognition.onend = function() {
                console.log('语音识别已结束');
                micIcon.classList.remove('listening');
                voiceStatusText.textContent = '语音识别已停止';
                updateStatus('准备就绪', '');
                
                // 如果语音识别意外结束，尝试重新启动（如果语音功能仍启用）
                if (isVoiceEnabled) {
                    setTimeout(() => {
                        if (isVoiceEnabled) {
                            recognition.start();
                        }
                    }, 1000);
                }
            };
            
            return recognition;
        }

        // 更新状态指示器
        function updateStatus(text, className) {
            statusText.textContent = text;
            statusDot.className = 'status-dot';
            if (className) {
                statusDot.classList.add(className);
            }
        }

        // 格式化文本为指定行宽
        function formatTextToLineWidth(text, lineWidth) {
            if (!text) return '';
            
            const words = text.split(/\s+/);
            let lines = [];
            let currentLine = '';
            
            for (const word of words) {
                if ((currentLine + ' ' + word).length <= lineWidth) {
                    currentLine = currentLine ? currentLine + ' ' + word : word;
                } else {
                    if (currentLine) lines.push(currentLine);
                    currentLine = word;
                }
            }
            
            if (currentLine) lines.push(currentLine);
            return lines.join('\n');
        }

        // 开始滚动
        function startScrolling() {
            if (isPlaying) return;
            
            const text = textInput.value.trim();
            if (!text) {
                alert('请输入台词内容！');
                return;
            }
            
            isPlaying = true;
            updateStatus('滚动中', 'active');
            
            const lineWidth = parseInt(lineWidthSlider.value);
            const fontSize = parseInt(fontSizeSlider.value);
            const speed = parseInt(speedSlider.value);
            
            // 应用样式
            prompterDisplay.style.fontSize = fontSize + 'px';
            
            // 格式化文本
            const formattedText = formatTextToLineWidth(text, lineWidth);
            prompterDisplay.textContent = formattedText;
            
            // 计算滚动参数
            const containerHeight = document.querySelector('.prompter-section').clientHeight;
            const textHeight = prompterDisplay.scrollHeight;
            const maxScroll = textHeight - containerHeight;
            
            if (maxScroll <= 0) {
                prompterDisplay.style.transform = 'translateY(0)';
                return;
            }
            
            currentPosition = 0;
            const scrollSpeed = 0.5 + (speed * 0.3); // 速度范围：0.8-3.5像素/帧
            
            function scrollStep() {
                if (!isPlaying) return;
                
                currentPosition += scrollSpeed;
                if (currentPosition >= maxScroll) {
                    currentPosition = maxScroll;
                    isPlaying = false;
                    updateStatus('已到底部', '');
                    return;
                }
                
                prompterDisplay.style.transform = `translateY(-${currentPosition}px)`;
                animationId = requestAnimationFrame(scrollStep);
            }
            
            animationId = requestAnimationFrame(scrollStep);
        }

        // 暂停滚动
        function pauseScrolling() {
            isPlaying = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            updateStatus('已暂停', '');
        }

        // 重置滚动
        function resetScrolling() {
            isPlaying = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            currentPosition = 0;
            prompterDisplay.style.transform = 'translateY(0)';
            updateStatus('准备就绪', '');
            
            // 如果语音识别正在运行，也停止它
            if (speechRecognition && isVoiceEnabled) {
                try {
                    speechRecognition.stop();
                } catch (e) {
                    console.log('语音识别已停止');
                }
                isVoiceEnabled = false;
                voiceBtn.textContent = '🎤 语音跟随';
                micIcon.classList.remove('listening');
                voiceStatusText.textContent = '语音识别未启动';
            }
        }

        // 切换语音跟随
        function toggleVoiceFollow() {
            if (!isSpeechSupported) {
                alert('您的浏览器不支持语音识别功能。请使用 Chrome 或 Edge 浏览器。');
                return;
            }
            
            if (!isVoiceEnabled) {
                // 启动语音识别
                if (!speechRecognition) {
                    speechRecognition = initSpeechRecognition();
                }
                
                if (speechRecognition) {
                    try {
                        speechRecognition.start();
                        isVoiceEnabled = true;
                        voiceBtn.textContent = '🔇 关闭语音';
                        updateStatus('语音监听中', 'active');
                    } catch (e) {
                        console.error('启动语音识别失败:', e);
                        alert('无法启动语音识别。请确保已授予麦克风权限。');
                    }
                }
            } else {
                // 停止语音识别
                if (speechRecognition) {
                    try {
                        speechRecognition.stop();
                    } catch (e) {
                        console.log('停止语音识别:', e);
                    }
                }
                isVoiceEnabled = false;
                voiceBtn.textContent = '🎤 语音跟随';
                micIcon.classList.remove('listening');
                voiceStatusText.textContent = '语音识别未启动';
                updateStatus('准备就绪', '');
            }
        }

        // 事件监听器
        lineWidthSlider.addEventListener('input', function() {
            lineWidthValue.textContent = this.value;
            // 如果正在播放，重新格式化文本
            if (isPlaying) {
                pauseScrolling();
                startScrolling();
            }
        });

        fontSizeSlider.addEventListener('input', function() {
            fontSizeValue.textContent = this.value + 'px';
            prompterDisplay.style.fontSize = this.value + 'px';
        });

        speedSlider.addEventListener('input', function() {
            speedValue.textContent = this.value;
            // 如果正在播放，调整速度
            if (isPlaying) {
                pauseScrolling();
                startScrolling();
            }
        });

        startBtn.addEventListener('click', startScrolling);
        pauseBtn.addEventListener('click', pauseScrolling);
        resetBtn.addEventListener('click', resetScrolling);
        voiceBtn.addEventListener('click', toggleVoiceFollow);

        // 页面加载时检查兼容性
        document.addEventListener('DOMContentLoaded', function() {
            checkCompatibility();
            
            // 添加示例文本
            textInput.value = `尊敬的各位来宾，大家好！

欢迎参加今天的产品发布会。
我是今天的主持人，很荣幸能在这里与大家分享一个激动人心的时刻。

今天，我们将为大家介绍一款革命性的智能设备。
这款设备将彻底改变我们与科技互动的方式。

它不仅拥有出色的性能，
更具备人性化的设计理念。
让我们一起来探索未来的可能性！`;
        });

        // 响应式调整
        window.addEventListener('resize', function() {
            if (isPlaying) {
                pauseScrolling();
                startScrolling();
            }
        });
    </script>
</body>
</html>
